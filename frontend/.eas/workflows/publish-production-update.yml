name: Publish production OTA update

# Runs automatically when the "ota-ready" label is added to a MERGED pull
# request (the `if:` below guards against labeling an open PR before its
# content has actually reached main — GitHub allows labeling closed/merged
# PRs, which is the intended way to fire this: merge, then label). Still
# runnable manually too, via `eas workflow:run` / the Expo MCP's
# workflow_run — adding a trigger doesn't remove that.
#
# Publishes the current JS bundle to the "production" EAS Update
# branch/channel, which is what the installed App Store / Play Store builds
# check for OTA updates. Only safe for JS-only changes — a native/runtime
# version change still needs a real build (see build-and-deploy or the
# "production" eas.json profile). Do not add "ota-ready" to a PR that touches
# native config (app.json's runtimeVersion/plugins, a new native module,
# anything under android/ or ios/) — label it only once you've confirmed the
# change is JS-only.
#
# IMPORTANT: `type: update` jobs do NOT read `build.<profile>.env` from
# eas.json — that's only consulted by `eas build`. Without `environment`/`env`
# set here, EXPO_PUBLIC_ vars are absent from the published JS bundle, so any
# device that applies the update gets an empty BACKEND in
# frontend/src/lib/auth.tsx and every API call (including sign-in) fails with
# "Invalid URL: /api/auth/session". This exact regression shipped via this
# workflow on 2026-09-02 (vantagelife-feedback-db issues #24, #25) — the
# inline `env` below is the same value as eas.json's build.production.env and
# is authoritative regardless of whether an EAS "production" Environment is
# also configured in the dashboard; keep both in sync if the backend URL
# ever changes.
#
# The EXPO_PUBLIC_AUTH0_* vars below are subject to the same rule, and are now
# populated from the "hypervividstudios" Auth0 tenant. These are public client
# identifiers (they ship inside the JS bundle by design — that is what the
# EXPO_PUBLIC_ prefix means); the Auth0 client *secrets* and the Google client
# secret live only in the Auth0 dashboard and Railway, never here.
# Clearing any one of them back to "" makes login.tsx's AUTH0_CONFIGURED false,
# which falls the published bundle back to the temporary Emergent flow rather
# than showing a broken Google button — a usable kill switch, but note the
# backend must still have AUTH0_DOMAIN/AUTH0_CLIENT_IDS set on Railway for the
# Auth0 path to work at all.

on:
  pull_request_labeled:
    labels:
      - ota-ready
    if: ${{ github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' }}

# pull_request_labeled checks out the PR's head commit, not main's tip after
# the merge — the `if:` above only decides whether the run fires, it doesn't
# change what gets checked out. If main moved between the merge and someone
# adding the label (another PR landed, or the merge itself resolved
# conflicts), publishing the PR head would ship a tree that's stale or never
# actually existed on main. The after_checkout hook below re-points every
# job at main's real, current tip before anything installs or publishes, so
# this workflow always ships what's actually live on main — for the label
# trigger, a manual `eas workflow:run`, or any other trigger added later.
defaults:
  hooks:
    after_checkout:
      - name: Check out main's current tip
        run: |
          git fetch origin main
          git checkout origin/main

jobs:
  publish_android_update:
    name: Publish Android update
    type: update
    environment: production
    env:
      EXPO_PUBLIC_BACKEND_URL: https://vantagelife21-production.up.railway.app
      EXPO_PUBLIC_AUTH0_DOMAIN: hypervividstudios.us.auth0.com
      EXPO_PUBLIC_AUTH0_WEB_CLIENT_ID: 40g1Jto97SOGLIWSfpkWweW9pqDD5GnM
      EXPO_PUBLIC_AUTH0_IOS_CLIENT_ID: frqVIMNvuCi0GSzJEktdKNETAwGf4z8p
    params:
      branch: production
      platform: android
  publish_ios_update:
    name: Publish iOS update
    type: update
    environment: production
    env:
      EXPO_PUBLIC_BACKEND_URL: https://vantagelife21-production.up.railway.app
      EXPO_PUBLIC_AUTH0_DOMAIN: hypervividstudios.us.auth0.com
      EXPO_PUBLIC_AUTH0_WEB_CLIENT_ID: 40g1Jto97SOGLIWSfpkWweW9pqDD5GnM
      EXPO_PUBLIC_AUTH0_IOS_CLIENT_ID: frqVIMNvuCi0GSzJEktdKNETAwGf4z8p
    params:
      branch: production
      platform: ios
